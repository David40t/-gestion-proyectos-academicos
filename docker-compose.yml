# Entorno completo: aplicación (Apache + PHP), worker de colas, scheduler y MySQL 8.
#   docker compose up -d --build   ->  http://localhost:8000
# Los valores se pueden sobrescribir con un archivo .env junto a este archivo (p. ej. APP_PORT=8080).
# APP_KEY no va aquí: se genera en el primer arranque y se guarda en el volumen "storage".

# La imagen la construye solo "app"; "queue" y "scheduler" la reutilizan (pull_policy: never).
x-app: &app
  image: gestion-proyectos-academicos:latest
  pull_policy: never
  restart: unless-stopped
  environment: &app-env
    APP_NAME: "Gestion de Proyectos Academicos"
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8000}
    APP_LOCALE: es
    APP_FALLBACK_LOCALE: es
    APP_FAKER_LOCALE: es_ES
    LOG_CHANNEL: stack
    LOG_STACK: single
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-gestion_proyectos}
    DB_USERNAME: ${DB_USERNAME:-gestion_user}
    DB_PASSWORD: ${DB_PASSWORD:-gestion_password}
    SESSION_DRIVER: database
    SESSION_LIFETIME: 120
    SESSION_ENCRYPT: "true"
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    FILESYSTEM_DISK: local
    BROADCAST_CONNECTION: log
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
    MAIL_FROM_NAME: "Gestion de Proyectos Academicos"
    MAIL_TO_ADDRESS: ${MAIL_TO_ADDRESS:-}
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    build: .
    pull_policy: build
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  queue:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: queue
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-gestion_proyectos}
      MYSQL_USER: ${DB_USERNAME:-gestion_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gestion_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db-data:
  storage:
